name: rust-test

on:
  push:
    branches:
      - 'main'
      - 'branch-*'
  pull_request:
    branches:
      - "*"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Format
        run: cargo fmt -- --check

  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-11
          # - windows-latest
        object_store:
          - version: "0.14"
            cargo_flags: --features integration-test
          - version: "0.13"
            cargo_flags: --no-default-features --features integration-test,object-store-0-13
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build and lint with clippy (object_store ${{ matrix.object_store.version }})
        run: cargo clippy --all-targets ${{ matrix.object_store.cargo_flags }} -- -D warnings

      - name: Check docs
        run: cargo doc ${{ matrix.object_store.cargo_flags }}

      - name: Check integration features (object_store ${{ matrix.object_store.version }})
        run: cargo check --all-targets ${{ matrix.object_store.cargo_flags }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - macos-11
          # - windows-latest
        object_store:
          - version: "0.14"
            cargo_flags: --features integration-test
          - version: "0.13"
            cargo_flags: --no-default-features --features integration-test,object-store-0-13
    runs-on: ${{ matrix.os }}
    env:
      # Disable full debug symbol generation to speed up CI build and keep memory down
      # "1" means line tables only, which is useful for panic tracebacks.
      RUSTFLAGS: -C debuginfo=1
      RUST_BACKTRACE: "1"
      RUST_LOG: debug

    steps:
      - uses: actions/checkout@v7

      - name: Install minimal stable with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Run tests (object_store ${{ matrix.object_store.version }})
        run: cargo test ${{ matrix.object_store.cargo_flags }}
